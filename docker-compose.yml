services:
  postgres:
    image: postgres:16-alpine
    container_name: adk-travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adk_travel
      POSTGRES_USER: adk
      POSTGRES_PASSWORD: adk_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adk -d adk_travel"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: adk-travel-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  channel-gateway:
    build:
      context: ./channel_gateway
    container_name: adk-channel-gateway
    restart: unless-stopped
    env_file:
      - ./channel_gateway/.env
    environment:
      AGENT_API_BASE_URL: http://host.docker.internal:8000/api
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway_password@channel-gateway-postgres:5432/channel_gateway
    ports:
      - "8010:8010"
    depends_on:
      channel-gateway-postgres:
        condition: service_healthy

  channel-gateway-postgres:
    image: postgres:16-alpine
    container_name: adk-channel-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: channel_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_password
    ports:
      - "5433:5432"
    volumes:
      - channel_gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d channel_gateway"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  pgadmin_data:
  channel_gateway_postgres_data:
