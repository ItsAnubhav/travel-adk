services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adk-travel-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /app/
    container_name: adk-travel-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - app
