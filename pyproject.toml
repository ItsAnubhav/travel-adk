[project]
name = "adk-travel-agents"
version = "0.1.0"
description = "Production-ready Google ADK Python scaffold for travel, expense, and booking agents."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.22.1",
  "adk-database-memory[postgres]>=0.1.0",
  "litellm>=1.80.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1.0",
  "orjson>=3.10.0",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["agent"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["services*", "frontend*", "tests*", "scripts*"]

[tool.setuptools.package-data]
"app.agents" = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
