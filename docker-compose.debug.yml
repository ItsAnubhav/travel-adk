version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adk_debug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adk-travel-app
    restart: unless-stopped
    environment:
      APP_NAME: adk-travel-agents
      APP_ENV: debug
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adk_debug
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADK_MODEL: ${ADK_MODEL}
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTH_API_BASE_URL: ${AUTH_API_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /app/
    container_name: adk-travel-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: adk-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
